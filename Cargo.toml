[package]
name = "guddalm_vsa"
version = "0.1.1"
edition = "2021"
rust-version = "1.87"
description = "Core VSA/HDC engine and algebraic primitives"
license = "AGPL-3.0-only"
documentation = "https://docs.rs/guddalm_vsa"
repository = "https://github.com/tariqselassie-hub/GuddaLM_VSA"
readme = "README.md"

[dependencies]
rand = "0.8"
rand_distr = "0.4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
candle-core = { version = "0.10", optional = true }
ndarray = { version = "0.16", features = ["serde"] }
dirs = "5.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
num-complex = "0.4"
rustfft = "6.4.1"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[features]
default = []
candle = ["dep:candle-core"]

[[bin]]
name = "guddalm_bench"
path = "src/bin/guddalm_bench.rs"

[[bench]]
name = "core_ops"
harness = false
